[package]
name = "backend"

authors.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
actix-web = "4.3.1"
chrono = "0.4.39"
futures = "0.3.30"
quick-xml = { version = "0.31.0", features = ["serialize"] }
