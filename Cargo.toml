[workspace]
members = ["models", "backend", "frontend/cli2", "frontend/desktop"]
resolver = "2"

[workspace.package]
authors = [
  "Tristan Schrader <t0rdos@pm.me>",
  "Tahoe Schrader <tahoeschrader@gmail.com",
]
edition = "2021"
version = "0.0.1"

[workspace.dependencies]
models = { path = "models" }
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
