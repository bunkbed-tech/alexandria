[package]
name = "alexandria-tauri"
version = "0.0.1"
authors = ["Tristan Schrader", "Tahoe Schrader"]
description = "Track your media"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
async-std = { version = "1.12.0", features = ["attributes", "tokio1"] }
sqlx = { version = "0.7.3", features = ["runtime-async-std", "tls-native-tls", "postgres", "time", "migrate"] }
quick-xml = { version = "0.31.0", features = ["serialize"] }
reqwest = "0.11.23"
tauri = { version = "2.0.0-beta", features = [] }
tauri-plugin-shell = "2.0.0-beta.4"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.105"

[lib]
name = "alexandria_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
